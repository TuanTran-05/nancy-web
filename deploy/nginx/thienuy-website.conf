server {
    listen 80;
    listen [::]:80;
    server_name thienuy.edu.vn www.thienuy.edu.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://thienuy.edu.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thienuy.edu.vn;

    ssl_certificate /etc/letsencrypt/live/thienuy.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thienuy.edu.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://thienuy.edu.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thienuy.edu.vn;

    ssl_certificate /etc/letsencrypt/live/thienuy.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thienuy.edu.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/thienuy-site/current;
    index index.html;
    charset utf-8;
    etag on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/thienuy-site-access.log;
    error_log /var/log/nginx/thienuy-site-error.log;

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
